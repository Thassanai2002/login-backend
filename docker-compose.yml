services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  loginapi:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=master;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
      Cors__AllowedOrigins__0: http://localhost:4200
      Cors__AllowedOrigins__1: https://login-frontend.thassanai-tangprom.workers.dev
    ports:
      - "80:8080"
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  mssql-data: